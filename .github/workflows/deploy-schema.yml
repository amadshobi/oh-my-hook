name: Deploy Schema & Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages Site
        run: |
          mkdir -p public/schemas
          cp schemas/omh.schema.json public/schemas/omh.schema.json
          cp schemas/omh.schema.json public/schema.json

          # Generate lightweight landing page
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>oh-my-hook — Configuration Schema</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background: #0d1117;
                color: #c9d1d9;
                max-width: 800px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.6;
              }
              h1 { color: #58a6ff; }
              code { background: #161b22; padding: 3px 6px; border-radius: 6px; font-family: monospace; }
              pre { background: #161b22; padding: 16px; border-radius: 8px; overflow-x: auto; border: 1px solid #30363d; }
              a { color: #58a6ff; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>oh-my-hook Configuration Schema</h1>
            <p>Official JSON Schema specification for <code>omh.jsonc</code> configuration files.</p>
            <h3>Schema URLs</h3>
            <ul>
              <li><strong>Standard:</strong> <a href="schema.json">https://amadshobi.github.io/oh-my-hook/schema.json</a></li>
              <li><strong>Namespaced:</strong> <a href="schemas/omh.schema.json">https://amadshobi.github.io/oh-my-hook/schemas/omh.schema.json</a></li>
            </ul>
            <h3>Usage in omh.jsonc</h3>
            <pre><code>{
  "$schema": "https://amadshobi.github.io/oh-my-hook/schema.json"
}</code></pre>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

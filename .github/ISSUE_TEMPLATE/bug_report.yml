name: Bug Report
description: Report a bug, unexpected guardrail block, or runtime error in oh-my-hook
title: "fix(module): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in **oh-my-hook**!
        Please fill out the form below to help us reproduce and resolve the problem quickly.

  - type: dropdown
    id: module
    attributes:
      label: Affected Module / Domain
      description: Which part of oh-my-hook encountered the issue?
      options:
        - "sandbox/ (Read-Guard, Stale-Write, Secrets, Bash Guard)"
        - "plans/ (Plan Mode, Archiving, Interactive Review)"
        - "memory/ (Markdown Store, /capture, AI Adapters)"
        - "compress/ (Dynamic Pruning, Milestones)"
        - "usage/ (Cloud Quota, SQLite, Session Tokens)"
        - "gateway/ (Local Gateway Discovery, CCA Normalizer)"
        - "imgsee/ (Vision Tool, Format Sniffing, OCR)"
        - "prompts/ (System Prompt Router)"
        - "tui/ (Sidebar Widget, Mode Badge, Modal Dialogs)"
        - "Other / Core"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node.js version, OpenCode version, and OS platform.
      placeholder: "e.g., Node.js v20.11.0, OpenCode v0.1.0, Linux Ubuntu 22.04 / macOS"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
      placeholder: "Explain the unexpected behavior or false-positive block..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start session in OpenCode
        2. Run slash command '/...' or call tool '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Paste any error messages, terminal traces, or guardrail block logs.
      render: shell
